<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Factory Automation | Skeuomorphism</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --metal-light: #5a5a5a;
            --metal-dark: #2b2b2b;
            --lcd-off: #1a221a;
            --lcd-on: #39ff14;
            --lcd-red: #ff3333;
            --screw: #111;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Dark Mesh Background */
            background: 
                radial-gradient(black 15%, transparent 16%) 0 0,
                radial-gradient(black 15%, transparent 16%) 8px 8px,
                radial-gradient(rgba(255,255,255,.1) 15%, transparent 20%) 0 1px,
                radial-gradient(rgba(255,255,255,.1) 15%, transparent 20%) 8px 9px;
            background-color: #282828;
            background-size: 16px 16px;
            color: #ddd;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- HEADER (Metal Badge) --- */
        header {
            width: 100%; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1200px; flex-wrap: wrap; gap: 15px;
            background: linear-gradient(to bottom, #444, #222);
            border-bottom: 4px solid #111;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0; font-size: 1.8rem;
            color: #e0e0e0;
            text-shadow: 0 -1px 0 #000, 0 1px 0 #666;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-controls { display: flex; gap: 20px; align-items: center; }

        /* --- SKEUOMORPHIC TOGGLE --- */
        .toggle-wrapper {
            display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 0.8rem; text-transform: uppercase;
            color: #aaa; text-shadow: 0 1px 0 #000;
        }

        .toggle-switch {
            appearance: none; -webkit-appearance: none;
            width: 60px; height: 26px;
            background: linear-gradient(to bottom, #111, #333);
            border-radius: 20px;
            border: 1px solid #000;
            box-shadow: inset 0 2px 5px #000, 0 1px 0 rgba(255,255,255,0.1);
            position: relative; cursor: pointer;
        }

        .toggle-switch::after {
            content: ''; position: absolute;
            top: 2px; left: 2px; width: 20px; height: 20px;
            background: radial-gradient(circle at 30% 30%, #eee, #999);
            border-radius: 50%;
            box-shadow: 1px 1px 3px #000;
            transition: 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .toggle-switch:checked {
            background: linear-gradient(to bottom, #003300, #006600);
        }
        
        .toggle-switch:checked::after { left: 36px; }

        /* --- CONTAINER --- */
        .container {
            display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;
            padding: 20px 15px 40px 15px; width: 100%; max-width: 1200px;
        }

        /* --- INDUSTRIAL PANEL CARD --- */
        .machine-card {
            width: 100%; max-width: 450px;
            background: linear-gradient(135deg, #4c4c4c, #3a3a3a);
            border: 1px solid #111;
            border-top: 1px solid #666;
            border-radius: 8px;
            padding: 25px;
            position: relative;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.6),
                inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        /* Screws */
        .machine-card::before, .machine-card::after {
            content: ''; position: absolute;
            width: 10px; height: 10px;
            background: radial-gradient(circle, #888 10%, #333 90%);
            border-radius: 50%;
            box-shadow: 0 1px 0 rgba(255,255,255,0.2), inset 0 1px 2px #000;
        }
        .machine-card::before { top: 10px; left: 10px; }
        .machine-card::after { top: 10px; right: 10px; }

        .machine-card h2 {
            margin: 0 0 20px 0; font-size: 1.4rem;
            color: #ddd; text-shadow: 0 -1px 0 #000;
            border-bottom: 2px groove #222;
            padding-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
            font-weight: 600;
        }

        /* --- LCD DISPLAY (Metrics) --- */
        .metric-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #111;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 2px solid #555;
            border-bottom-color: #777; /* Highlight bottom for inset effect */
            border-right-color: #777;
            border-top-color: #000;
            border-left-color: #000;
            box-shadow: inset 2px 2px 10px #000;
            cursor: pointer;
            transition: 0.1s;
        }
        .metric-row:active { transform: translateY(2px); }

        .metric-info { display: flex; flex-direction: column; }
        .metric-label { font-size: 0.7rem; color: #888; text-transform: uppercase; font-family: monospace; letter-spacing: 1px; margin-bottom: 2px; }
        
        .metric-value { 
            font-family: 'Orbitron', monospace; 
            font-size: 1.8rem; 
            color: var(--lcd-on);
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.6);
        }

        /* Mini CRT Chart */
        .mini-chart { 
            width: 100px; height: 45px; 
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.2),
                rgba(0,0,0,0.2) 1px,
                transparent 1px,
                transparent 2px
            );
            border: 1px solid #333;
            opacity: 0.8;
            filter: contrast(1.2) brightness(1.1);
        }

        /* --- LED STATUS LIGHT --- */
        .status-container {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            padding: 12px; font-weight: 700; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px;
            color: #aaa; text-shadow: 0 -1px 0 #000;
            background: linear-gradient(to bottom, #333, #222);
            border-radius: 20px;
            border: 1px solid #000;
            box-shadow: 0 1px 0 rgba(255,255,255,0.1);
            margin-top: 10px;
        }

        .led {
            width: 12px; height: 12px; border-radius: 50%;
            background: #222; border: 1px solid #000;
            box-shadow: inset 1px 1px 2px #000;
        }

        .operational .led { 
            background: #00ff00; 
            box-shadow: 0 0 8px #00ff00, inset -2px -2px 4px rgba(0,0,0,0.3);
        }
        .critical .led { 
            background: #ff0000; 
            box-shadow: 0 0 10px #ff0000, inset -2px -2px 4px rgba(0,0,0,0.3);
            animation: blink 0.5s infinite alternate;
        }
        .critical .metric-value { color: var(--lcd-red); text-shadow: 0 0 5px rgba(255, 51, 51, 0.6); }

        /* --- MODAL (Glass Cover) --- */
        #focusOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999; justify-content: center; align-items: center; padding: 15px;
        }
        #focusOverlay.active { display: flex; }

        .focus-modal {
            width: 100%; max-width: 900px; padding: 5px;
            background: #444; border-radius: 10px;
            box-shadow: 0 20px 50px #000;
            border: 2px solid #222;
        }

        .modal-inner {
            background: linear-gradient(180deg, #333, #222);
            border: 1px solid #555; border-radius: 6px;
            padding: 25px;
        }

        .focus-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        
        /* Physical Buttons */
        .push-btn {
            background: linear-gradient(to bottom, #555, #333);
            color: #fff; font-weight: bold; text-transform: uppercase;
            padding: 10px 20px; border-radius: 4px;
            border: 1px solid #000; border-top: 1px solid #777;
            box-shadow: 0 3px 0 #111, 0 5px 5px rgba(0,0,0,0.4);
            cursor: pointer; transition: 0.1s;
            font-size: 0.8rem;
        }
        .push-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #111, inset 0 2px 5px rgba(0,0,0,0.5);
            background: #333;
        }
        .btn-red { background: linear-gradient(to bottom, #a00, #600); border-top: 1px solid #d55; }
        .btn-blue { background: linear-gradient(to bottom, #0055aa, #003366); border-top: 1px solid #4488ff; }

        /* Dropdown looks like a slot */
        .slot-select {
            background: #111; color: var(--lcd-on); font-family: 'Orbitron', monospace;
            border: 2px solid #555; border-radius: 4px;
            padding: 8px; box-shadow: inset 2px 2px 5px #000;
            outline: none;
        }

        .chart-frame { 
            background: #000; border: 4px solid #333; border-radius: 10px;
            padding: 10px; position: relative;
            box-shadow: inset 0 0 20px #000;
        }
        /* CRT Screen Reflection */
        .chart-frame::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.3; } }
        
        /* Mobile */
        @media (max-width: 600px) {
            header { flex-direction: column; align-items: center; gap: 15px; }
            .header-controls { width: 100%; justify-content: space-around; }
            .machine-card { margin-bottom: 20px; }
            .focus-header { flex-direction: column; align-items: stretch; text-align: center; }
            .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .slot-select { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Factory<span style="color: #666;">OS</span> <span style="font-size: 0.8rem; color: #888; letter-spacing: 0;">v2.0</span></h1>
        
        <div class="header-controls">
            <div class="toggle-wrapper">
                <span>Live</span>
                <input type="checkbox" id="demoMode" class="toggle-switch" onchange="toggleDemoMode()">
                <span>Demo</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="machine-card operational" id="card-Machine A">
            <h2><i class="fas fa-microchip" style="color: #888;"></i> MACHINE A</h2>
            
            <div class="metric-row" onclick="openFocus('Machine A', 'temperature', 'TEMP (°C)')">
                <div class="metric-info">
                    <span class="metric-label">CORE TEMP</span>
                    <span class="metric-value" id="val-temp-Machine A">--</span>
                </div>
                <div class="mini-chart"><canvas id="mini-temp-Machine A"></canvas></div>
            </div>

            <div class="metric-row" onclick="openFocus('Machine A', 'current', 'LOAD (A)')">
                <div class="metric-info">
                    <span class="metric-label">AMP DRAW</span>
                    <span class="metric-value" id="val-curr-Machine A">--</span>
                </div>
                <div class="mini-chart"><canvas id="mini-curr-Machine A"></canvas></div>
            </div>

            <div class="status-container" id="status-box-Machine A">
                <div class="led"></div>
                <span id="status-text-Machine A">INITIALIZING</span>
            </div>
        </div>

        <div class="machine-card operational" id="card-Machine B">
            <h2><i class="fas fa-cogs" style="color: #888;"></i> MACHINE B</h2>
            
            <div class="metric-row" onclick="openFocus('Machine B', 'temperature', 'TEMP (°C)')">
                <div class="metric-info">
                    <span class="metric-label">CORE TEMP</span>
                    <span class="metric-value" id="val-temp-Machine B">--</span>
                </div>
                <div class="mini-chart"><canvas id="mini-temp-Machine B"></canvas></div>
            </div>

            <div class="metric-row" onclick="openFocus('Machine B', 'current', 'LOAD (A)')">
                <div class="metric-info">
                    <span class="metric-label">AMP DRAW</span>
                    <span class="metric-value" id="val-curr-Machine B">--</span>
                </div>
                <div class="mini-chart"><canvas id="mini-curr-Machine B"></canvas></div>
            </div>

            <div class="status-container" id="status-box-Machine B">
                <div class="led"></div>
                <span id="status-text-Machine B">INITIALIZING</span>
            </div>
        </div>
    </div>

    <div id="focusOverlay">
        <div class="focus-modal">
            <div class="modal-inner">
                <div class="focus-header">
                    <div>
                        <h2 id="focusTitle" style="margin: 0; font-family: 'Orbitron', sans-serif; color: #fff;">ANALYSIS</h2>
                        <span style="color: #888; font-size: 0.8rem; font-family: monospace;">// REAL-TIME STREAM //</span>
                    </div>
                    
                    <div class="controls">
                        <select id="rangeSelect" class="slot-select" onchange="updateFocusRange()">
                            <option value="20">LAST 20 SAMPLES</option>
                            <option value="60000">T-MINUS 1 MIN</option>
                            <option value="300000">T-MINUS 5 MIN</option>
                            <option value="all">FULL LOG</option>
                        </select>
                        
                        <button class="push-btn btn-blue" onclick="downloadReport()">
                            <i class="fas fa-print"></i> PRINT
                        </button>
                        
                        <button class="push-btn btn-red" onclick="closeFocus()">
                            <i class="fas fa-power-off"></i> EXIT
                        </button>
                    </div>
                </div>
                
                <div class="chart-frame">
                    <div style="height: 300px;">
                        <canvas id="focusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // const socket = io('http://192.168.137.1:3000');
        const socket = io('https://guna-factory-automation.vercel.app');
        const LIMITS = { temperature: 36, current: 4.0 };
        const historyData = { "Machine A": [], "Machine B": [] };
        const MAX_HISTORY_POINTS = 500;
        const miniCharts = {}; 
        let focusChart = null; 
        let currentFocus = { machine: null, metric: null };
        let demoInterval = null;

        // --- OSCILLOSCOPE STYLE CHART ---
        Chart.defaults.font.family = "'Courier New', monospace";
        Chart.defaults.color = '#00aa00';
        Chart.defaults.borderColor = '#114411';

        function createMiniChart(ctx, limitValue) {
            return new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ data: [], borderWidth: 1.5, pointRadius: 0, fill: false, 
                    tension: 0.2,
                    borderColor: '#39ff14', // Classic green phosphor
                    segment: { borderColor: ctx => ctx.p0.parsed.y > limitValue || ctx.p1.parsed.y > limitValue ? '#ff3333' : '#39ff14' }
                }]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { 
                        x: { display: false }, 
                        y: { display: true, grid: { color: '#222' }, ticks: { display: false } } 
                    },
                    animation: false
                }
            });
        }

        ['Machine A', 'Machine B'].forEach(machine => {
            const tempCtx = document.getElementById(`mini-temp-${machine}`).getContext('2d');
            const currCtx = document.getElementById(`mini-curr-${machine}`).getContext('2d');
            miniCharts[`${machine}_temp`] = createMiniChart(tempCtx, LIMITS.temperature);
            miniCharts[`${machine}_curr`] = createMiniChart(currCtx, LIMITS.current);
        });

        // --- DATA HANDLING ---
        socket.on('init_history', (history) => {
            if (document.getElementById('demoMode').checked) return;
            const now = Date.now();
            Object.assign(historyData, history);
            for (const [machine, data] of Object.entries(history)) {
                data.forEach((point, index) => {
                    if(!point.timestamp) point.timestamp = now - ((data.length - index) * 2000);
                    updateUI(machine, point);
                });
            }
        });

        socket.on('update_data', (data) => {
            if (document.getElementById('demoMode').checked) return;
            data.timestamp = Date.now();
            updateUI(data.machine_id, data);
        });

        function toggleDemoMode() {
            const isDemo = document.getElementById('demoMode').checked;
            if (isDemo) {
                historyData["Machine A"] = [];
                historyData["Machine B"] = [];
                demoInterval = setInterval(() => {
                    ['Machine A', 'Machine B'].forEach(m => {
                        const fakeData = {
                            machine_id: m,
                            temperature: (Math.random() * (95 - 60) + 60).toFixed(1),
                            current: (Math.random() * (22 - 12) + 12).toFixed(2),
                            time: new Date().toLocaleTimeString('en-US', { hour12: false }),
                            timestamp: Date.now()
                        };
                        updateUI(m, fakeData);
                    });
                }, 2000);
            } else {
                clearInterval(demoInterval);
                location.reload();
            }
        }

        function updateUI(machine, data) {
            historyData[machine].push(data);
            if(historyData[machine].length > MAX_HISTORY_POINTS) historyData[machine].shift();
            
            document.getElementById(`val-temp-${machine}`).innerText = data.temperature;
            document.getElementById(`val-curr-${machine}`).innerText = data.current;

            const card = document.getElementById(`card-${machine}`);
            const statusBox = document.getElementById(`status-box-${machine}`);
            const statusText = document.getElementById(`status-text-${machine}`);
            
            if (data.temperature > LIMITS.temperature || data.current > LIMITS.current) {
                card.classList.remove('operational');
                card.classList.add('critical');
                statusBox.className = "status-container critical";
                statusText.innerText = "CRITICAL FAILURE";
                statusText.style.color = "#ff3333";
            } else {
                card.classList.remove('critical');
                card.classList.add('operational');
                statusBox.className = "status-container operational";
                statusText.innerText = "SYSTEM NORMAL";
                statusText.style.color = "#aaa";
            }

            addChartData(miniCharts[`${machine}_temp`], data.time, data.temperature, 20);
            addChartData(miniCharts[`${machine}_curr`], data.time, data.current, 20);

            if (currentFocus.machine === machine && focusChart) updateFocusRange();
        }

        function addChartData(chart, label, value, maxPoints) {
            chart.data.labels.push(label);
            chart.data.datasets[0].data.push(value);
            if (chart.data.labels.length > maxPoints) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update('none');
        }

        // --- FOCUS MODAL ---
        function openFocus(machine, metric, title) {
            currentFocus = { machine, metric };
            document.getElementById('focusOverlay').classList.add('active');
            document.getElementById('focusTitle').innerText = `${machine} // ${title}`;
            renderFocusChart();
        }

        function closeFocus() {
            document.getElementById('focusOverlay').classList.remove('active');
            currentFocus = { machine: null, metric: null };
            if (focusChart) { focusChart.destroy(); focusChart = null; }
        }

        function updateFocusRange() {
            if (!focusChart || !currentFocus.machine) return;
            const range = document.getElementById('rangeSelect').value;
            const data = historyData[currentFocus.machine];
            const metric = currentFocus.metric;
            
            let filtered = (range === 'all') ? data : 
                           (range === '20') ? data.slice(-20) : 
                           data.filter(d => d.timestamp > Date.now() - parseInt(range));

            focusChart.data.labels = filtered.map(d => d.time);
            focusChart.data.datasets[0].data = filtered.map(d => d[metric]);
            focusChart.update('none');
        }

        function renderFocusChart() {
            if (focusChart) focusChart.destroy();
            const ctx = document.getElementById('focusChart').getContext('2d');
            const limit = LIMITS[currentFocus.metric];

            focusChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{
                        label: currentFocus.metric,
                        data: [],
                        borderWidth: 2,
                        borderColor: '#39ff14',
                        backgroundColor: 'rgba(57, 255, 20, 0.1)',
                        fill: true,
                        tension: 0.2,
                        pointRadius: 2,
                        pointBackgroundColor: '#000',
                        pointBorderColor: '#39ff14',
                        segment: { borderColor: ctx => ctx.p0.parsed.y > limit || ctx.p1.parsed.y > limit ? '#ff3333' : '#39ff14' }
                }]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: '#222' }, ticks: { color: '#00aa00' } },
                        y: { grid: { color: '#333' }, ticks: { color: '#39ff14', font: {family: 'Orbitron'} } }
                    },
                    plugins: { legend: { display: false } },
                    animation: false
                }
            });
            updateFocusRange();
        }

        async function downloadReport() {
            if (!focusChart) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');
            
            // Black Background for Print
            doc.setFillColor(20, 20, 20); 
            doc.rect(0, 0, 297, 210, 'F'); 

            doc.setTextColor(255, 255, 255);
            doc.setFont("courier", "bold");
            doc.setFontSize(22);
            doc.text(`LOG REPORT: ${currentFocus.machine}`, 15, 20);
            
            doc.setFontSize(12);
            doc.setTextColor(57, 255, 20); // Green Text
            doc.text(`PARAMETER: ${currentFocus.metric.toUpperCase()}`, 15, 30);
            doc.text(`TIMESTAMP: ${new Date().toLocaleString()}`, 15, 36);
            
            const canvas = document.getElementById('focusChart');
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.fillStyle = '#000000';
            tCtx.fillRect(0,0,tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);
            
            doc.addImage(tempCanvas.toDataURL("image/jpeg"), 'JPEG', 15, 45, 267, 130); 
            doc.save(`${currentFocus.machine}_Report.pdf`);
        }
    </script>
</body>
</html>
